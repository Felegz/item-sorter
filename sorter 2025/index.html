<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Item Sorter</title>
  <script src="runtime-mode.js?v=20260911-auto-context"></script>
  <script src="auto-context.js?v=20260911-auto-context"></script>

</head>
<body>
  <!--
    THESIS: The full list is a working document, not a dashboard; it refuses a wall of equally loud controls.
    OWN-WORLD: Deep graphite surfaces, warm white text, restrained mint state color, hairline dividers, and compact rectangular controls.
    STORY: Scan or edit the ordered list, insert a batch into priority order, then reach occasional tools without losing the document.
    FIRST VIEWPORT: Compact shared navigation and sync status lead directly into the two primary list actions and the text editor; filters and utilities stay folded.
    FORM: Calm operations ledger, grounded direction five, seed 6ce9094d.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
  -->
  <div class="app">
    <header class="app-header">
      <nav class="view-switch" aria-label="Разделы">
        <a href="/" aria-current="page">Список</a>
        <a href="/tasks">Задачи</a>
      </nav>
      <button type="button" id="sync-badge" class="sync-badge" data-state="idle" onclick="dropboxSmartSync()" title="Запустить синхронизацию">
        <span class="sync-status-text">○ Sync off</span>
      </button>
    </header>

    <main class="list-workspace">
      <section class="workspace-head">
        <div class="primary-actions" aria-label="Сортировка списка">
          <button id="insert-button" class="btn--accent">Insert Unsorted Tasks</button>
          <button id="sort-button">Sort Tasks</button>
          <button id="filter-button">Filter Tasks</button>
          <button id="merge-button">Merge Arrays</button>
        </div>
      </section>

      <details class="filter-panel">
        <summary>Фильтры</summary>
        <div id="filter-bar"></div>
      </details>

      <section class="editor-surface">
        <label class="sr-only" for="task-list">Список задач</label>
        <textarea
          class="text-field"
          id="task-list"
          data-mobile-editor
          data-mobile-editor-shell
          placeholder="Enter your list of tasks here.
Write one task per line.
Duplicate and empty lines will be ignored automatically.
Hit Sort button.
Output will appear in the same area as input.
Your text will be stored in browser memory even after page reload, but it's not reliable! Better save it somewhere else too!"
        ></textarea>
      </section>

      <details class="question-panel">
        <summary>Вопрос для сравнения</summary>
        <label class="sr-only" for="user-question">Пользовательский вопрос для сравнения задач</label>
        <textarea
          id="user-question"
          data-mobile-editor
          data-mobile-editor-shell
          rows="2"
          placeholder="Which task would bring more value or impact if completed first? (Enter your custom question here)"
          class="text-field"
        ></textarea>
      </details>

      <details class="command-panel">
        <summary>Ещё инструменты</summary>
        <div class="toolbar">
          <div class="btn-group">
            <span class="btn-group-label">Задача</span>
            <div class="btn-row">
              <button id="done-button" class="btn--ghost">Отметить текущую строку выполненной</button>
              <button id="assign-priorities-btn">Присвоить приоритеты</button>
              <button id="process-btn">Обработать (GTD)</button>
              <button id="quick-triage-btn">Быстрый разбор</button>
              <button id="delegate-ai-button">Поручить строку ИИ</button>
            </div>
          </div>

          <div class="btn-group">
            <span class="btn-group-label">Данные</span>
            <div class="btn-row">
              <button id="assign-creation-dates-btn" type="button">Заполнить даты создания</button>
              <input
                id="assign-creation-date-input"
                class="bulk-date-picker"
                type="date"
                aria-label="Дата создания для задач без даты"
                hidden
              />
              <button id="copy-button" class="btn--ghost">Copy</button>
              <button id="save-button" class="btn--ghost" onclick="saveAsTxt()">Save .txt</button>
              <button id="dbx-login-btn" class="btn--dbx-login">Войти в Dropbox</button>
              <button id="dbx-sync-btn" class="btn--accent" hidden>Синхронизировать</button>
              <button id="dbx-save-btn" class="btn--dbx-save btn--sm" hidden>В Dropbox</button>
              <button id="dbx-load-btn" class="btn--dbx-load btn--sm" hidden>Из Dropbox</button>
              <button id="dbx-history-btn" class="btn--ghost btn--sm" hidden onclick="showSnapshots()">История</button>
              <button id="ai-jobs-btn" class="btn--ghost btn--sm">Поручения ИИ</button>
              <button id="dbx-logout-btn" class="btn--ghost btn--sm" hidden>Выйти из Dropbox</button>
            </div>
            <div id="dbx-status"></div>
          </div>

          <div class="btn-group">
            <span class="btn-group-label">Автоконтекст</span>
            <div class="btn-row">
              <button id="set-home-coordinates-btn" type="button">Задать координаты дома</button>
            </div>
            <div id="home-coordinates-status" class="tool-status" aria-live="polite"></div>
          </div>
        </div>
      </details>
    </main>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- date-fns 4.4.0 — MIT license, date-fns.org -->
    <script src="https://cdn.jsdelivr.net/npm/@date-fns/cdn@4.4.0/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@date-fns/cdn@4.4.0/locale/ru/cdn.min.js"></script>

    <script src="markers.js?v=20260911-ignored-filter"></script>
    <script src="mobile-edit-mode.js?v=20260911-edit-return"></script>
    <script src="task-format.js?v=20260912-meta-order"></script>
    <script src="task-list-operations.js?v=20260911-ignored-filter"></script>
    <script src="ai-exchange.js?v=20260906-ai-bridge"></script>
    <script src="app.js?v=20260911-ignored-filter"></script>
    <script src="dropbox.js?v=20260911-developer-mode"></script>
    <script src="ai-dropbox.js?v=20260906-ai-bridge"></script>
    <script src="todotxt.js?v=20260911-developer-mode"></script>
    <script>
      const _origSetDbxStatus = setDbxStatus;
      setDbxStatus = function(text) {
        _origSetDbxStatus(text);
        updateCompactSyncBadge(text);
      };

      function updateCompactSyncBadge(text) {
        const badge = document.getElementById('sync-badge');
        if (!badge) return;

        const setBadge = (state, label, title) => {
          badge.dataset.state = state;
          badge.querySelector('.sync-status-text').textContent = label;
          badge.title = title;
          badge.setAttribute('aria-label', `${title}. Нажмите, чтобы синхронизировать`);
        };

        if (SorterRuntime.isDeveloperMode) {
          setBadge('developer', 'DEV · Dropbox off', 'Developer-список изолирован; Dropbox полностью отключён');
          return;
        }

        if (typeof getToken !== 'function' || !getToken()) {
          setBadge('off', '○ Sync off', 'Dropbox не подключён');
          return;
        }

        const status = text !== undefined ? text
          : (typeof getLastSyncText === 'function' ? getLastSyncText() : '');

        if (status.includes('…') || status.includes('🔄')) {
          setBadge('loading', '↻ Syncing…', status || 'Идёт синхронизация');
          return;
        }

        if (/ошиб|не удалось|конфликт/i.test(status)) {
          setBadge('error', '! Sync failed', status);
          return;
        }

        let sync;
        try { sync = JSON.parse(localStorage.getItem('dbx_last_sync') || 'null'); }
        catch (_) { sync = null; }

        if (!sync?.time) {
          setBadge('idle', '○ Sync now', 'Dropbox подключён, синхронизация ещё не запускалась');
          return;
        }

        const ageMinutes = Math.max(0, Math.floor((Date.now() - sync.time) / 60_000));
        let age;
        if (ageMinutes < 1) age = 'just now';
        else if (ageMinutes < 60) age = `${ageMinutes} min ago`;
        else if (ageMinutes < 1440) age = `${Math.floor(ageMinutes / 60)} h ago`;
        else age = `${Math.floor(ageMinutes / 1440)} d ago`;

        const state = ageMinutes <= 15 ? 'ok' : 'stale';
        const fullStatus = typeof getLastSyncText === 'function' ? getLastSyncText() : status;
        setBadge(state, `✓ Sync · ${age}`, fullStatus || `Последняя синхронизация: ${age}`);
      }

      setInterval(() => updateCompactSyncBadge(), 60_000);
      setTimeout(() => updateCompactSyncBadge(), 300);
    </script>
    <script>
      (function initHomeCoordinatesControl() {
        const button = document.getElementById('set-home-coordinates-btn');
        const status = document.getElementById('home-coordinates-status');
        if (!button || !status) return;

        const saved = SorterAutoContext.getHomeCoordinates(localStorage);
        if (saved) status.textContent = 'Координаты дома сохранены в этом браузере';

        button.addEventListener('click', async () => {
          button.disabled = true;
          status.dataset.state = 'loading';
          status.textContent = 'Определяю текущее место…';
          try {
            await SorterAutoContext.captureHomeCoordinates(
              localStorage,
              navigator.geolocation,
            );
            status.dataset.state = 'success';
            status.textContent = 'Готово. Это место сохранено как дом только в этом браузере';
          } catch (error) {
            status.dataset.state = 'error';
            status.textContent = `${error.message}. Разреши геопозицию и повтори`;
          } finally {
            button.disabled = false;
          }
        });
      })();
    </script>

    <footer>
      <p>
        Created by
        <a href="https://linktr.ee/kostya.kushko">Kostya Kushko</a>
        with &#x1F5A4;
      </p>
    </footer>

  </div>
</body>
</html>
