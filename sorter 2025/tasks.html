<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Tasks</title>
  <script src="runtime-mode.js?v=20260911-auto-context"></script>
  <script src="auto-context.js?v=20260911-auto-context"></script>
  <!-- vanilla-context-menu 1.6.0 — MIT license, github.com/GeorgianStan/vanilla-context-menu -->
  <!-- Native text-selection menus must remain available, including inside the editor. -->
  <script src="task-action-menu.js?v=20260917"></script>
  <script src="unsaved-changes.js?v=20260917"></script>
  <!-- date-fns 4.4.0 — MIT license, date-fns.org -->
  <script src="https://cdn.jsdelivr.net/npm/@date-fns/cdn@4.4.0/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@date-fns/cdn@4.4.0/locale/ru/cdn.min.js"></script>
  <script src="markers.js?v=20260911-ignored-filter"></script>
  <script src="mobile-edit-mode.js?v=20260917-collapse"></script>
  <script src="task-format.js?v=20261005-old-creation-age"></script>
  <script src="task-list-operations.js?v=20261005-due-menu"></script>
  <script src="ai-exchange.js?v=20260906-ai-bridge"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="icons.js?v=20261005-due-menu"></script>
  <link rel="stylesheet" href="tasks.css?v=20261005-menu-layer" />
  <link rel="stylesheet" href="task-format.css?v=20260917-creation-date" />
</head>
<body>
  <!--
    THESIS: Ready tasks form an action queue, not a stack of decorative cards; it refuses hidden hover-only controls and filter walls.
    OWN-WORLD: Deep graphite field, warm white text, restrained mint state color, hairline separators, and compact rectangular controls.
    STORY: Capture one task, scan the actionable queue, complete or refine it, and reveal metadata tools only when needed.
    FIRST VIEWPORT: Compact shared navigation and sync status lead directly into status tabs and tasks; capture, search, filtering, and sorting stay in the bottom command bar.
    FORM: Calm operations ledger, grounded direction five, seed 6ce9094d.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
  -->
  <div class="tasks-app">
  <header class="app-header">
    <nav class="view-switch" aria-label="Разделы">
      <a href="/">Список</a>
      <a href="/tasks" aria-current="page">Задачи</a>
    </nav>
    <button type="button" id="sync-badge" class="sync-badge" data-state="idle" onclick="dropboxSmartSync()" title="Запустить синхронизацию">
      <span class="sync-status-text">○ Sync off</span>
    </button>
  </header>

  <main>

  <!-- Quick add -->
  <div class="add-bar" data-mobile-editor-shell>
    <div class="add-input-wrap">
      <label class="sr-only" for="add-input">Новая задача</label>
      <textarea id="add-input" rows="1" data-mobile-editor data-mobile-editor-layout="capture" data-task-text-input placeholder="Новая задача… (A) +проект @контекст due:2026-04-10"></textarea>
      <div id="ac-drop" class="ac-drop" style="display:none"></div>
    </div>
    <button type="button" id="add-cancel" class="add-cancel">Отмена</button>
    <button id="add-btn" title="Добавить (Enter)">Добавить</button>
  </div>

  <!-- Search -->
  <div class="search-bar" data-mobile-editor-shell>
    <label class="sr-only" for="search">Поиск задач</label>
    <input id="search" type="search" data-mobile-editor data-mobile-editor-layout="search" placeholder="Поиск задач">
    <button class="search-clear" id="search-clear" style="display:none" title="Очистить">Очистить</button>
    <span class="kbd" title="Нажми / чтобы сфокусироваться">/</span>
    <button type="button" class="search-close" data-mobile-close aria-label="Закрыть поиск" title="Закрыть поиск">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="search-hint">Операторы: <code>-слово</code> исключить &nbsp; <code>OR</code> или <code>||</code> &nbsp; <code>AND</code> или <code>&&</code> &nbsp; <code>"точная фраза"</code></div>

  <!-- Tabs -->
  <div class="tasks-tabs-row">
    <div class="tabs">
      <button class="tab on" data-t="active">Активные</button>
      <button class="tab" data-t="all">Все</button>
      <button class="tab" data-t="done">Выполненные</button>
    </div>
    <span class="task-count"><span id="count">0</span> tasks</span>
  </div>

  <div class="auto-context-banner" id="auto-context-banner" hidden aria-live="polite">
    <span class="auto-context-key">AUTO</span>
    <span id="auto-context-summary"></span>
  </div>

  <section class="mobile-tools-panel" id="mobile-tools-panel" aria-label="Настройка списка">
    <div class="mobile-panel-heading">
      <strong>Настройка списка</strong>
      <button type="button" class="mobile-panel-close btn--ghost btn--sm" data-mobile-close>Закрыть</button>
    </div>

  <details class="filters-panel" id="filters-panel">
    <summary>Фильтры</summary>

  <!-- Priority filter -->
  <div id="pri-sec" class="chip-section" style="display:none">
    <div class="chip-label" onclick="toggleChipSection('pri-sec')">Приоритет <span class="chip-toggle" aria-hidden="true"></span></div>
    <div class="chip-row" id="pri-row"></div>
  </div>

  <!-- Context filter -->
  <div id="ctx-sec" class="chip-section" style="display:none">
    <div class="chip-label" onclick="toggleChipSection('ctx-sec')">Контекст <span class="chip-toggle" aria-hidden="true"></span></div>
    <div class="chip-row" id="ctx-row"></div>
    <label class="context-match-control" for="context-match-mode">
      <span>Для нескольких контекстов</span>
      <select id="context-match-mode">
        <option value="or">Хотя бы один (ИЛИ)</option>
        <option value="and">Все выбранные (И)</option>
      </select>
    </label>
  </div>

  <!-- Project filter -->
  <div id="proj-sec" class="chip-section" style="display:none">
    <div class="chip-label" onclick="toggleChipSection('proj-sec')">Проект <span class="chip-toggle" aria-hidden="true"></span></div>
    <div class="chip-row" id="proj-row"></div>
  </div>

  <!-- Hashtag filter -->
  <div id="ht-sec" class="chip-section" style="display:none">
    <div class="chip-label" onclick="toggleChipSection('ht-sec')">Хэштег <span class="chip-toggle" aria-hidden="true"></span></div>
    <div class="chip-row" id="ht-row"></div>
  </div>
    <button id="clear-filters" style="display:none">Сбросить фильтры</button>
  </details>

  <!-- Sort + clear -->
  <div class="controls">
    <label for="sort">Сортировка</label>
    <select id="sort">
      <option value="order">По порядку</option>
      <option value="proj">По проекту</option>
      <option value="pri">По приоритету</option>
      <option value="due">По сроку (due:)</option>
      <option value="date">По дате создания</option>
      <option value="text">По алфавиту</option>
    </select>
    <button id="archive-btn" class="archive-btn" style="display:none" onclick="archiveCompleted()" title="Архивировать выполненные">Архив</button>
    <button id="future-btn" class="archive-btn" style="display:none" onclick="toggleFuture()" title="Показать или скрыть задачи с будущей датой t:">Будущие (<span id="future-count">0</span>)</button>
    <button id="dbx-history-btn" class="btn--ghost btn--sm" hidden onclick="showSnapshots()">История</button>
    <button id="ai-jobs-btn" class="btn--ghost btn--sm" onclick="SorterAiDropbox.showJobsDialog()">Поручения ИИ</button>
    <button id="dbx-sync-btn" hidden tabindex="-1" aria-hidden="true">Синхронизировать</button>
  </div>
  </section>

  <div class="tasklist" id="list"></div>
  <button id="ignored-toggle"></button>

  </main>

  <button type="button" class="task-add-fab" data-mobile-panel="add" aria-controls="add-input" aria-expanded="false" aria-label="Добавить задачу" title="Добавить задачу">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <button type="button" class="mobile-scrim" aria-label="Закрыть панель" data-mobile-close hidden></button>
  <nav class="mobile-taskbar" aria-label="Действия со списком">
    <button type="button" class="mobile-taskbar-action" data-mobile-panel="search" aria-controls="search" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <span>Поиск</span>
    </button>
    <button type="button" class="mobile-taskbar-action" data-mobile-panel="tools" aria-controls="mobile-tools-panel" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
      <span>Ещё</span>
    </button>
  </nav>
  </div>

  <!-- Classic blocking script: keep globals shared with the Dropbox integration below. -->
  <script src="tasks-page.js?v=20261006-extract"></script>
  <script src="dropbox.js?v=20261004-stale-sync"></script>
  <script src="ai-dropbox.js?v=20260906-ai-bridge"></script>
  <script>
    // \u2500\u2500 Dropbox \u0438\u043d\u0442\u0435\u0433\u0440\u0430\u0446\u0438\u044f \u0434\u043b\u044f tasks.html \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
    // \u041f\u0435\u0440\u0435\u0437\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044c \u0437\u0430\u0434\u0430\u0447\u0438 \u043f\u043e\u0441\u043b\u0435 Dropbox-\u0437\u0430\u0433\u0440\u0443\u0437\u043a\u0438
    window._onDbxLoad = () => {
      // Only called after replacement approval; stale drafts must not edit a different task.
      editingIdx = -1;
      editingTempValue = null;
      addInput.value = '';
      loadItems();
    };

    // \u041e\u0432\u0435\u0440\u0440\u0430\u0439\u0434 setDbxStatus \u2014 \u043e\u0431\u043d\u043e\u0432\u043b\u044f\u0435\u043c \u0431\u0435\u0439\u0434\u0436 \u0432 \u0448\u0430\u043f\u043a\u0435
    const _origSetDbxStatus = setDbxStatus;
    setDbxStatus = function(text) {
      _origSetDbxStatus(text);
      _updateSyncBadge(text);
    };

    function _updateSyncBadge(text) {
      const badge = document.getElementById('sync-badge');
      if (!badge) return;

      const setBadge = (state, label, title) => {
        badge.dataset.state = state;
        badge.querySelector('.sync-status-text').textContent = label;
        badge.title = title;
        badge.setAttribute('aria-label', `${title}. Нажмите, чтобы синхронизировать`);
      };

      if (SorterRuntime.isDeveloperMode) {
        setBadge('developer', 'DEV · Dropbox off', 'Developer-список изолирован; Dropbox полностью отключён');
        return;
      }

      if (typeof getToken !== 'function' || !getToken()) {
        setBadge('off', '○ Sync off', 'Dropbox не подключён');
        return;
      }

      const t = text !== undefined ? text
                : (typeof getLastSyncText === 'function' ? getLastSyncText() : '');

      if (t.includes('\u2026') || t.includes('\uD83D\uDD04')) {
        badge.dataset.state = 'loading';
        setBadge('loading', '↻ Syncing…', t || 'Идёт синхронизация');
        return;
      }

      if (/ошиб|не удалось|конфликт/i.test(t)) {
        setBadge('error', '! Sync failed', t);
        return;
      }

      let sync;
      try { sync = JSON.parse(localStorage.getItem('dbx_last_sync') || 'null'); }
      catch (_) { sync = null; }

      if (!sync?.time) {
        setBadge('idle', '○ Sync now', 'Dropbox подключён, синхронизация ещё не запускалась');
        return;
      }

      const presentation = getCompactSyncAge(sync.time);
      const fullStatus = typeof getLastSyncText === 'function' ? getLastSyncText() : t;
      const title = presentation.state === 'stale'
        ? `Синхронизация устарела. ${fullStatus || presentation.age}`
        : (fullStatus || `Последняя синхронизация: ${presentation.age}`);
      setBadge(presentation.state, presentation.label, title);
    }

    setInterval(() => _updateSyncBadge(), 60_000);
    setTimeout(() => _updateSyncBadge(), 300);
    window.addEventListener('sorter-ai-jobs-updated', () => render());
  </script>
</body>
</html>
