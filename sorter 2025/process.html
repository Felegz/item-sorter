<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Разбор задачи</title>
  <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64,AAABAAEAEBAQAAEABAAoAQAAFgAAACgAAAAQAAAAIAAAAAEABAAAAAAAgAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAA/4QAAADZ/wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAERERERERERESAAAAAAAAARIAAAAAAAABEgAAABEgAAESAAABESAAARIAABEREgABEgABESESAAESABESAREgARIBESAAESABEhESAAARIAESESAAABEQARIAAAAAARABEgAAAAABEAESAAAAAAAAARIiIiIiIiIhEREREREREREAAAAAP/4AAD/+AAA/HgAAPh4AADwOAAA4DgAAMIYAACHGAAADxgAAB8YAAD/mAAA/5gAAP/4AAAAAAAAAAAAA" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    :root {
      --bg:        #1a1a1a;
      --bg-card:   #232323;
      --bg-el:     #282828;
      --fg:        #f2f2f2;
      --fg-m:      #8888a0;
      --primary:   #4ade80;
      --primary-h: #22c55e;
      --border:    #2e2e2e;
      --radius:    0.5rem;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.25rem 1rem 4rem;
    }
    .page { width: 100%; max-width: 640px; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.25rem; padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 1.1rem; font-weight: 700; color: var(--primary); }
    .back { color: var(--fg-m); text-decoration: none; font-size: 0.85rem; }
    .back:hover { color: var(--fg); }
    .task-cap {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 0.6rem 0.9rem;
      font-family: 'JetBrains Mono', monospace; font-size: 0.875rem;
      color: var(--fg); line-height: 1.5; margin-bottom: 1rem; word-break: break-word;
    }
    .mode-sel { display: flex; gap: 0.6rem; margin-bottom: 1.25rem; }
    .mode-btn {
      flex: 1; padding: 1rem 0.75rem; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--bg-card);
      color: var(--fg); font-family: inherit; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; text-align: center; line-height: 1.4;
      transition: border-color 0.1s, background 0.1s;
    }
    .mode-btn:hover { border-color: var(--primary); background: var(--bg-el); }
    .mode-btn .sub { display: block; font-size: 0.72rem; font-weight: 400; color: var(--fg-m); margin-top: 0.2rem; }
    .card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.25rem; margin-bottom: 0.75rem;
    }
    .badge { font-size: 0.62rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--fg-m); margin-bottom: 0.5rem; }
    .step-q { font-size: 1.25rem; font-weight: 700; line-height: 1.3; margin-bottom: 0.4rem; }
    .step-hint { font-size: 0.82rem; color: var(--fg-m); line-height: 1.6; margin-bottom: 1.1rem; white-space: pre-line; }
    .choices { display: flex; flex-direction: column; gap: 0.45rem; }
    .c-btn {
      display: block; width: 100%; padding: 0.8rem 1rem;
      border-radius: 7px; border: 1px solid var(--border); background: var(--bg-el);
      color: var(--fg); text-align: left; font-family: inherit; font-size: 0.95rem;
      font-weight: 500; cursor: pointer; line-height: 1.3;
      transition: background 0.08s, border-color 0.08s;
    }
    .c-btn:hover { background: var(--border); border-color: var(--primary); }
    .c-btn.yes    { border-color: #4ade80; color: #86efac; }
    .c-btn.yes:hover { background: #152b1a; }
    .c-btn.no     { color: var(--fg-m); }
    .c-btn.no:hover  { color: var(--fg); }
    .c-btn.warn   { border-color: #f59e0b; color: #fcd34d; }
    .c-btn.warn:hover { background: #271900; }
    .c-btn.danger { border-color: #f87171; color: #fca5a5; }
    .c-btn.danger:hover { background: #1f0808; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; }
    .chip {
      padding: 0.3rem 0.65rem; border-radius: 999px; border: 1px solid var(--border);
      background: transparent; color: var(--fg-m); cursor: pointer;
      font-family: inherit; font-size: 0.82rem; transition: all 0.08s;
    }
    .chip.sel { border-color: var(--primary); background: rgba(74,222,128,0.15); color: var(--fg); }
    .ctx-group-label { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.07em;
      text-transform: uppercase; color: var(--fg-m); margin: 0.8rem 0 0.3rem; }
    .ctx-group-label:first-child { margin-top: 0; }
    textarea, input[type=text], input[type=date] {
      width: 100%; background: var(--bg-el); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--fg); padding: 0.65rem 0.9rem;
      font-family: inherit; font-size: 0.95rem; line-height: 1.5; margin-bottom: 0.75rem;
    }
    textarea { min-height: 70px; resize: vertical; }
    textarea:focus, input:focus { outline: none; border-color: var(--primary); }
    .act-row { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.75rem; }
    /* Revolut-unified button system — same tokens as style.css */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem;
      padding: 0.5rem 1rem; border-radius: var(--radius); border: 1px solid var(--border);
      background: var(--bg-el); color: var(--fg); font-family: inherit;
      font-size: 0.875rem; font-weight: 600; letter-spacing: -0.01em;
      cursor: pointer; white-space: nowrap; line-height: 1;
      box-shadow: 0 1px 2px rgba(0,0,0,0.25);
      transition: background 0.14s, border-color 0.14s, box-shadow 0.14s, transform 0.1s;
    }
    .btn:hover { background: var(--border); border-color: var(--primary); box-shadow: 0 2px 6px rgba(0,0,0,0.35); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); box-shadow: none; }
    .btn-p { background: var(--primary); border-color: transparent; color: #0d1117; font-weight: 700; }
    .btn-p:hover { background: var(--primary-h); border-color: transparent; box-shadow: 0 2px 8px rgba(74,222,128,0.35); }
    .btn-g { background: transparent; border-color: var(--border); color: var(--fg); box-shadow: none; font-size: 0.82rem; }
    .btn-g:hover { background: var(--bg-el); border-color: var(--border); box-shadow: none; transform: none; }
    .out-card {
      background: var(--bg-card); border: 1px solid var(--primary);
      border-radius: var(--radius); padding: 1rem 1.25rem; margin-bottom: 0.75rem;
    }
    .out-action {
      font-family: 'JetBrains Mono', monospace; font-size: 0.9rem;
      word-break: break-all; line-height: 1.6;
      border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; margin-bottom: 0.75rem;
      outline: none; border-radius: 4px; cursor: text;
      transition: background 0.1s;
    }
    .out-action:hover { background: rgba(255,255,255,0.04); }
    .out-action:focus { background: rgba(255,255,255,0.07); outline: 1px solid var(--primary); }
    .out-goal { font-size: 0.85rem; color: var(--fg-m); line-height: 1.6; }
    .out-goal strong { color: var(--fg); }
    .out-field { margin-top: 0.55rem; font-size: 0.85rem; color: var(--fg); line-height: 1.5; white-space: pre-wrap; }
    .out-field-lbl { display: block; font-size: 0.67rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--fg-m); margin-bottom: 0.1rem; }
    .task-cap { transition: border-color 0.1s; }
    .task-cap:hover { border-color: var(--primary); }
    .task-cap::after { content: ' ✒'; font-size: 0.75rem; color: var(--fg-m); }
    .friend-quote {
      background: rgba(74,222,128,0.08); border-left: 3px solid var(--primary);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 0.75rem 1rem; margin-bottom: 1rem;
      font-size: 0.9rem; line-height: 1.6; color: var(--fg);
    }
    .friend-label { display: block; font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-m); margin-bottom: 0.35rem; }
    .note { font-size: 0.8rem; color: var(--fg-m); margin-top: 0.5rem; }
    .note.ok { color: #86efac; }
    .note.error { color: #fca5a5; }
    /* Completion has one green save action; copy and navigation are secondary. */
    h1 { display: flex; align-items: center; gap: 0.4rem; }
    .lucide-icon { flex: 0 0 auto; vertical-align: middle; }
    .btn { min-height: 44px; text-decoration: none; white-space: normal; line-height: 1.3; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn:focus-visible, .back:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
    .completion-date { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 0.6rem; margin: 1rem 0; }
    .completion-date label { display: block; font-size: 0.85rem; margin-bottom: 0.35rem; }
    .completion-date input { margin: 0; min-height: 44px; color-scheme: dark; }
    .completion-date .note { grid-column: 1 / -1; margin: 0; }
    .completion-save { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0.6rem; }
    .completion-nav { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; padding-top: 0.75rem; border-top: 1px solid var(--border); }
    .completion-nav .btn { flex: 1 1 auto; }
    .save-status { margin: 0.6rem 0; min-height: 1.3em; }
    #out-line::selection { background: #305a3e; color: var(--fg); }
    @media (max-width: 480px) {
      .completion-save, .completion-date { grid-template-columns: minmax(0, 1fr); }
      .completion-date .btn { justify-self: start; }
    }
    .hidden { display: none !important; }

    /* The shared collapse action only leaves focus mode; it never saves or resets a GTD answer. */
    .mobile-editor-collapse { display: none; }

    /* Mobile focus mode spends the keyboard-reduced viewport on the current answer. */
    @media (max-width: 760px) {
      body {
        padding: 0.75rem 0.6rem 2rem;
      }

      textarea,
      input[type=text],
      input[type=date] {
        font-size: 1rem;
      }

      body.mobile-editor-active {
        min-height: 0;
        height: var(--mobile-editor-height, 100dvh);
        padding: 6px;
        overflow: hidden;
        align-items: stretch;
      }

      body.mobile-editor-active .page {
        min-height: 0;
        height: 100%;
        max-width: none;
      }

      body.mobile-editor-active header,
      body.mobile-editor-active #task-cap,
      body.mobile-editor-active #mode-sel,
      body.mobile-editor-active .badge,
      body.mobile-editor-active .step-hint,
      body.mobile-editor-active .friend-quote {
        display: none !important;
      }

      body.mobile-editor-active #edit-area:not(:focus-within),
      body.mobile-editor-active #step-area:not(:focus-within),
      body.mobile-editor-active #out-area:not(:focus-within) {
        display: none !important;
      }

      body.mobile-editor-active #edit-area:focus-within,
      body.mobile-editor-active #step-area:focus-within,
      body.mobile-editor-active #out-area:focus-within,
      body.mobile-editor-active .card:focus-within {
        min-height: 0;
        height: 100%;
      }

      body.mobile-editor-active .card:focus-within {
        display: flex;
        flex-direction: column;
        margin: 0;
        padding: 10px;
        overflow: hidden;
      }

      body.mobile-editor-active .card:focus-within .mobile-editor-collapse {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        align-self: flex-end;
        flex: 0 0 44px;
        width: 44px;
        height: 44px;
        margin-bottom: 6px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg-el);
        color: var(--fg);
        cursor: pointer;
      }

      .mobile-editor-collapse:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

      body.mobile-editor-active .step-q {
        flex: 0 0 auto;
        margin-bottom: 6px;
        font-size: 1rem;
      }

      body.mobile-editor-active textarea:focus {
        min-height: 140px;
        height: auto;
        flex: 1;
        margin: 0 0 6px;
        padding: 12px;
        resize: none;
      }

      body.mobile-editor-active input[type=text]:focus {
        min-height: 52px;
        margin-bottom: 8px;
      }

      body.mobile-editor-active .act-row {
        flex: 0 0 auto;
        margin-top: auto;
      }

      body.mobile-editor-active .out-card {
        min-height: 0;
        flex: 1;
        overflow: auto;
      }

      body.mobile-editor-active .out-action:focus {
        min-height: 140px;
      }
      /* The shared visualViewport height reserves room for text and Save.
         Date, copy and secondary navigation return when the editor collapses. */
      body.mobile-editor-active #out-area .completion-date,
      body.mobile-editor-active #out-area .completion-nav,
      body.mobile-editor-active #out-area #next-task-btn,
      body.mobile-editor-active #out-area #out-goal,
      body.mobile-editor-active #out-area #out-note,
      body.mobile-editor-active #out-area #out-title,
      body.mobile-editor-active #out-area #offer-mutny { display: none; }
      body.mobile-editor-active #out-area #out-note.error {
        display: block;
        flex: 0 0 auto;
        max-height: 4.5em;
        overflow: auto;
      }
      body.mobile-editor-active #out-area .completion-save { display: flex; flex: 0 0 auto; }
      body.mobile-editor-active #out-area #save-task-btn { width: 100%; }
      body.mobile-editor-active #out-area .out-card { display: flex; flex-direction: column; padding: 10px; margin-bottom: 6px; }
      body.mobile-editor-active #out-area .out-action { flex: 1; min-height: 0; overflow: auto; margin: 0; padding: 6px; border: 0; }
    }
  </style>
</head>
<body>
<div class="page">
  <header>
    <h1><span data-sorter-icon="sparkles"></span>Разбор задачи</h1>
    <a id="back-link" href="/" class="back">&#x2190; К списку</a>
    <script>(function(){
      var f = new URLSearchParams(window.location.search).get('from');
      if (f === 'tasks') document.getElementById('back-link').href = '/tasks';
    })();</script>
  </header>

  <div id="task-cap" class="task-cap hidden" onclick="returnToEdit()" title="Нажми, чтобы отредактировать задачу" style="cursor:pointer"></div>

  <div id="mode-sel" class="mode-sel">
    <button class="mode-btn" onclick="startFlow('korz')">
      &#x1F4E5; Разбор корзины
      <span class="sub">С этим надо что-то делать?</span>
    </button>
    <button class="mode-btn" onclick="startFlow('mutny')">
      &#x1F52E; Мутная задача
      <span class="sub">Непонятно следующее действие</span>
    </button>
  </div>

  <div id="edit-area" class="card hidden" data-mobile-editor-shell>
    <button type="button" class="mobile-editor-collapse" data-mobile-editor-collapse aria-label="Свернуть редактор" title="Свернуть редактор"><span data-sorter-icon="minimize-2"></span></button>
    <div class="badge" id="edit-badge"></div>
    <div class="step-q">Что нужно обработать?</div>
    <div class="step-hint">Отредактируй текст задачи если нужно</div>
    <textarea id="task-input" rows="3" placeholder="Задача или идея..." data-mobile-editor data-task-text-input></textarea>
    <div class="act-row">
      <button class="btn btn-p" onclick="afterEdit()">Дальше &#x2192;</button>
    </div>
  </div>

  <div id="step-area" class="hidden"></div>

  <div id="out-area" class="hidden">
    <div class="card" data-mobile-editor-shell>
      <button type="button" class="mobile-editor-collapse" data-mobile-editor-collapse aria-label="Свернуть редактор" title="Свернуть редактор"><span data-sorter-icon="minimize-2"></span></button>
      <div class="step-q" id="out-title" style="margin-bottom:0.75rem"></div>
      <div class="out-card">
        <div class="out-action" id="out-line" contenteditable="true" spellcheck="false" title="Нажми, чтобы отредактировать" data-mobile-editor></div>
        <div class="out-goal" id="out-goal"></div>
      </div>
      <div class="completion-date">
        <div>
          <label for="out-due">Срок задачи</label>
          <input id="out-due" type="date" onchange="setOutputDue(this.value)" />
        </div>
        <button id="google-calendar-btn" class="btn" onclick="openGoogleCalendar()" disabled title="Выберите срок; создание события нужно подтвердить в Google"><span data-sorter-icon="calendar-days"></span>Google Calendar</button>
        <p class="note">Google Calendar открывает форму события. Подтвердите создание там.</p>
      </div>
      <div class="note save-status" id="out-save-status" role="status" aria-live="polite">Не сохранено</div>
      <div class="completion-save">
        <button id="save-task-btn" class="btn btn-p" onclick="addToList()"><span data-sorter-icon="check"></span>Сохранить в список</button>
        <button id="next-task-btn" class="btn" onclick="nextTask()"><span data-sorter-icon="sparkles"></span>Сохранить и разобрать ещё</button>
      </div>
      <div class="completion-nav">
        <a id="bottom-back-link" class="btn btn-g" href="/">К списку</a>
        <button class="btn btn-g" onclick="copyOut()"><span data-sorter-icon="copy"></span>Копировать</button>
        <button class="btn btn-g" onclick="resetAll()"><span data-sorter-icon="undo-2"></span>Новый разбор</button>
      </div>
      <div class="note" id="out-note" role="status" aria-live="polite"></div>
    </div>
    <div id="offer-mutny" class="card hidden">
      <div class="step-q" style="font-size:1rem;margin-bottom:0.5rem">Задача мутная? Запустить разбор?</div>
      <div class="act-row">
        <button class="btn" onclick="continueWithMutny()"><span data-sorter-icon="sparkles"></span>Разобрать мутную задачу</button>
        <button class="btn btn-g" onclick="el('offer-mutny').classList.add('hidden')">Нет, и так всё ясно</button>
      </div>
    </div>
  </div>
</div>

<script src="runtime-mode.js?v=20260911-developer-mode"></script>
<script src="markers.js?v=20260911-ignored-filter"></script>
<script src="task-format.js?v=20261009-due-fields"></script>
<script src="task-list-operations.js?v=20261009-due-fields"></script>
  <script src="gtd-task-tools.js?v=20261010-old-review"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="unsaved-changes.js?v=20260917-gtd"></script>
<script src="flows.js?v=20261009-gtd-finish"></script>
<script src="icons.js?v=20261009-gtd-finish"></script>
<script src="mobile-edit-mode.js?v=20261009-gtd-collapse"></script>
<script>
// ==========================================================================
//  ДВИЖОК (алгоритм — в flows.js)
// ==========================================================================

const S = {
  task:'', originalTask:'', mode:null, flow:null, stepIdx:0, history:[],
  outcome:'', action:'', delegate:'', dueDate:'',
  // Historical flow field: red/green means a heart project, never todo.txt A/B.
  priority:null, contexts:[], feelings:'', advice:'',
  occurrence:null, openedDocument:null, savedOutput:null,
};

function el(id)       { return document.getElementById(id); }
function hide(...ids) { ids.forEach(i => el(i)?.classList.add('hidden')); }
function show(...ids) { ids.forEach(i => el(i)?.classList.remove('hidden')); }

function startFlow(mode) {
  S.mode = mode; S.flow = FLOWS[mode]; S.history = [];
  hide('mode-sel');
  el('edit-badge').textContent = mode === 'korz' ? 'РАЗБОР КОРЗИНЫ' : 'МУТНАЯ ЗАДАЧА';
  el('task-input').value = S.task;
  show('edit-area');
  el('task-input').focus();
}

function afterEdit() {
  const v = el('task-input').value.trim();
  if (!v) { el('task-input').focus(); return; }
  S.task = v;
  el('task-cap').textContent = v;
  show('task-cap');
  hide('edit-area');
  // If we're mid-flow (returned to edit from a step), go back to that step.
  // If starting fresh, start from step 0.
  const resumeIdx = S.flow && S.stepIdx > 0 ? S.stepIdx : 0;
  if (resumeIdx === 0) S.history = [];
  renderStep(resumeIdx);
}

function renderStep(idx) {
  const step = S.flow[idx];
  if (!step) { finalize(); return; }

  // Auto-skip: check skipIf condition before rendering
  if (step.skipIf && step.skipIf()) {
    renderStep(findIdx(step.skipTo));
    return;
  }

  S.stepIdx = idx;
  hide('out-area');
  const area = el('step-area');
  show('step-area');

  const mlabel = S.mode === 'korz' ? 'РАЗБОР КОРЗИНЫ' : 'МУТНАЯ ЗАДАЧА';
  const total  = S.flow.length;
  // Support both static hint string and dynamic hintFn
  const hint = step.hintFn ? step.hintFn() : (step.hint || '');
  const hintHtml = step.hintHtmlFn ? step.hintHtmlFn() : (step.hintHtml || '');

  let h = '<div class="card" data-mobile-editor-shell>';
  // Text steps are generated after DOMContentLoaded, so render their icon directly.
  if (step.type === 'text') h += '<button type="button" class="mobile-editor-collapse" data-mobile-editor-collapse aria-label="Свернуть редактор" title="Свернуть редактор">' + SorterIcons.render('minimize-2') + '</button>';
  h += '<div class="badge">' + mlabel + ' &mdash; шаг ' + (idx+1) + ' / ' + total + '</div>';
  h += '<div class="step-q">' + esc(step.q) + '</div>';
  if (hint) h += '<div class="step-hint">' + esc(hint) + '</div>';
  if (hintHtml) h += hintHtml;

  if (step.type === 'choice') {
    h += '<div class="choices">';
    step.choices.forEach((c, ci) => {
      const cls = c.style ? ' ' + c.style : '';
      let fn;
      if      (c.back)   fn = 'goTo(' + findIdx(c.back) + ')';
      else if (c.switch) fn = "switchFlow('" + c.switch + "'," + ci + ')';
      else if (c.action) fn = "doAction('"  + c.action + "'," + ci + ')';
      else               fn = 'goNext(' + findIdx(c.next) + ',' + ci + ')';
      h += '<button class="c-btn' + cls + '" onclick="' + fn + '">' + esc(c.label) + '</button>';
    });
    h += '</div>';

  } else if (step.type === 'text') {
    const val = esc(S[step.field] || '');
    if (step.multiline) {
      h += '<textarea id="sf" data-mobile-editor placeholder="' + esc(step.placeholder||'') + '">' + val + '</textarea>';
    } else {
      h += '<input type="text" id="sf" data-mobile-editor placeholder="' + esc(step.placeholder||'') + '" value="' + val + '" />';
    }
    h += '<div class="act-row">';
    if (step.action)
      h += '<button class="btn btn-p" onclick="textAction(\'' + step.field + '\',\'' + step.action + '\')">Дальше &rarr;</button>';
    else
      h += '<button class="btn btn-p" onclick="textNext(\'' + step.field + '\',' + findIdx(step.next) + ')">Дальше &rarr;</button>';
    h += '</div>';

  } else if (step.type === 'date') {
    h += '<input type="date" id="sf" required value="' + (S.dueDate || todayStr()) + '" />';
    h += '<div class="act-row">';
    if (step.action)
      h += '<button class="btn btn-p" onclick="dateAction(\'' + step.field + '\',\'' + step.action + '\')">Дальше &rarr;</button>';
    else
      h += '<button class="btn btn-p" onclick="dateNext(\'' + step.field + '\',' + findIdx(step.next) + ')">Дальше &rarr;</button>';
    h += '</div>';

  } else if (step.type === 'contexts') {
    if (step.groups) {
      step.groups.forEach(g => {
        h += '<div class="ctx-group-label">' + esc(g.label) + '</div>';
        h += '<div class="chips">';
        g.chips.forEach(tag => {
          const sel = S.contexts.includes(tag) ? ' sel' : '';
          h += '<button class="chip' + sel + '" onclick="toggleCtx(this,\'' + esc(tag) + '\')">' + esc(tag) + '</button>';
        });
        h += '</div>';
      });
    } else {
      h += '<div class="chips">';
      (step.chips || []).forEach(tag => {
        const sel = S.contexts.includes(tag) ? ' sel' : '';
        h += '<button class="chip' + sel + '" onclick="toggleCtx(this,\'' + esc(tag) + '\')">' + esc(tag) + '</button>';
      });
      h += '</div>';
    }
    const ni = findIdx(step.next);
    h += '<div class="act-row">';
    h += '<button class="btn btn-p" onclick="goNext(' + ni + ',-1)">Дальше &rarr;</button>';
    h += '<button class="btn btn-g" onclick="goNext(' + ni + ',-1)">Пропустить</button>';
    h += '</div>';

  } else if (step.type === 'coinflip') {
    const heads = Math.random() < 0.5;
    const noIdx = findIdx(step.noactionId || 'noaction');
    const yesIdx = findIdx(step.yesId || 'mine');
    if (heads) {
      h += '<div style="font-size:2.5rem;line-height:1;margin:0.25rem 0">🪙</div>';
      h += '<div class="step-q" style="margin-top:0.3rem">Выпал орёл. Не надо делать.</div>';
      h += '<div class="step-hint">Монетка решила: задача не требует действий.\n\nВот что с ней можно сделать:\n\u2022 Отложить в «Когда-нибудь / Может быть» и рассмотреть позже\n\u2022 Добавить в справочные материалы\n\u2022 Удалить в корзину</div>';
      h += '<div class="choices">';
      h += '<button class="c-btn warn" onclick="goNext(' + noIdx + ',-1)">Принять решение монетки &rarr;</button>';
      h += '<button class="c-btn no" onclick="renderStep(' + idx + ')">\uD83D\uDD04 Перебросить монетку</button>';
      h += '<button class="c-btn yes" onclick="goNext(' + yesIdx + ',-1)">Всё равно буду делать</button>';
      h += '</div>';
    } else {
      h += '<div style="font-size:2.5rem;line-height:1;margin:0.25rem 0">🪙</div>';
      h += '<div class="step-q" style="margin-top:0.3rem">Выпала решка. Делаем!</div>';
      h += '<div class="step-hint">Монетка решила: задача требует действий.</div>';
      h += '<div class="choices">';
      h += '<button class="c-btn yes" onclick="goNext(' + yesIdx + ',-1)">Делаем &rarr;</button>';
      h += '<button class="c-btn no" onclick="renderStep(' + idx + ')">\uD83D\uDD04 Перебросить монетку</button>';
      h += '<button class="c-btn warn" onclick="goNext(' + noIdx + ',-1)">Всё равно не буду делать</button>';
      h += '</div>';
    }
  }

  h += '<div style="margin-top:0.75rem;display:flex;gap:0.5rem;flex-wrap:wrap">';
  if (S.history.length > 0)
    h += '<button class="btn btn-g" onclick="goBack()">&larr; Назад</button>';
  h += '<button class="btn btn-g" onclick="returnToEdit()" title="Изменить исходный текст задачи"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="13" height="13" style="vertical-align:-1px;margin-right:4px"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>Задача</button>';
  h += '</div>';

  h += '</div>';
  area.innerHTML = h;

  const sf = el('sf');
  if (sf) {
    sf.focus();
    if (!step.multiline && step.type === 'text') {
      sf.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); sf.closest('.card').querySelector('.btn-p')?.click(); }
      });
    }
  }
  window.scrollTo(0,0);
}

function findIdx(id) { return S.flow.findIndex(s => s.id === id); }

function goNext(idx, ci) {
  const step = S.flow[S.stepIdx];
  if (ci >= 0 && step.choices?.[ci]?.pri) S.priority = step.choices[ci].pri;
  S.history.push(S.stepIdx);
  renderStep(idx);
}
function goTo(idx) { renderStep(idx); }
function goBack() {
  if (!S.history.length) return;
  // Save any text/date currently in the input before going back
  const sf = el('sf');
  if (sf) {
    const step = S.flow[S.stepIdx];
    if (step && step.field) S[step.field] = sf.value;
  }
  renderStep(S.history.pop());
}
function returnToEdit() {
  // Save current field value if applicable
  const sf = el('sf');
  if (sf) {
    const step = S.flow[S.stepIdx];
    if (step && step.field) S[step.field] = sf.value;
  }
  hide('step-area', 'out-area');
  el('task-input').value = S.task;
  show('edit-area');
  el('task-input').focus();
  window.scrollTo(0, 0);
}
function switchFlow(mode, ci) {
  S.mode = mode; S.flow = FLOWS[mode]; S.history = []; S.stepIdx = 0;
  renderStep(0);
}
function doAction(action, ci) {
  const step = S.flow[S.stepIdx];
  if (ci >= 0 && step.choices?.[ci]?.pri) S.priority = step.choices[ci].pri;
  showOutput(action);
}
function textNext(field, nextIdx) {
  const sf = el('sf'); if (!sf) return;
  S[field] = sf.value.trim(); S.history.push(S.stepIdx); renderStep(nextIdx);
}
function textAction(field, action) {
  const sf = el('sf'); if (!sf) return;
  S[field] = sf.value.trim(); showOutput(action);
}
function dateAction(field, action) {
  const sf = el('sf');
  if (!sf || !TaskGtd.validDate(sf.value)) { sf?.focus(); sf?.reportValidity(); return; }
  S[field] = sf.value; showOutput(action);
}
function dateNext(field, nextIdx) {
  const sf = el('sf'); if (sf) S[field] = sf.value;
  S.history.push(S.stepIdx); renderStep(nextIdx);
}
function toggleCtx(btn, tag) {
  btn.classList.toggle('sel');
  if (S.contexts.includes(tag)) S.contexts = S.contexts.filter(t => t !== tag);
  else S.contexts.push(tag);
}
function finalize() { showOutput(S.mode === 'korz' ? 'next_action' : 'output'); }

// --- Output ---

function showOutput(action) {
  hide('step-area'); show('out-area'); hide('offer-mutny');
  const t = todayStr();
  let line='', title='Результат разбора', goalHtml='';

  if (action === 'trash') {
    title='Удалить'; line='# УДАЛЕНО: ' + S.task;
  } else if (action === 'someday') {
    title='Когда-нибудь'; line=S.task + ' +someday-maybe';
  } else if (action === 'ref') {
    title='Справочная информация'; line=S.task + ' +information';
  } else if (action === 'delegate') {
    title='Делегировано';
    const who = S.delegate ? ' @' + S.delegate.replace(/\s+/g,'_') : '';
    line=S.task + ' @ожидание' + who + ' due:' + t;
  } else if (action === 'calendar') {
    title='В календарь'; line=S.task + ' due:' + (S.dueDate || t);
  } else if (action === 'now') {
    title='Сделать прямо сейчас'; line='x ' + t + ' ' + S.task;
  } else if (action === 'next_action') {
    title='Следующее действие'; line=buildNextLine(t);
    if (S.mode==='korz') show('offer-mutny');
  } else if (action === 'output') {
    title='Результат разбора'; line=buildMutnyLine(t);
    // Show goal, difficulty and advice separately in the UI (they're also embedded in the line)
    if (S.outcome)  goalHtml += '<div class="out-field"><span class="out-field-lbl">Цель</span>' + esc(S.outcome)  + '</div>';
    if (S.feelings) goalHtml += '<div class="out-field"><span class="out-field-lbl">Сложность</span>' + esc(S.feelings) + '</div>';
    if (S.advice)   goalHtml += '<div class="out-field"><span class="out-field-lbl">Совет</span>' + esc(S.advice)   + '</div>';
  }

  if (action !== 'trash') line = TaskGtd.withColor(TaskGtd.prepareOutput(line, S.originalTask, todayStr()), S.priority);
  if (action === 'calendar') line = TaskGtd.withDueDate(line, S.dueDate || t);
  el('out-title').textContent = title;
  el('out-line').textContent  = line;
  syncOutputDate();
  el('out-goal').innerHTML    = goalHtml;
  el('out-note').textContent  = '';
  el('out-note').className    = 'note';
  updateSaveStatus();
  updateNextTask();
}

function buildNextLine(t) {
  return TaskFormat.serializeTaskLine({
    creationDate: t,
    text: S.action || S.task,
    contexts: S.contexts.map(context => context.replace(/^@/, '')),
    dueDate: S.dueDate || null,
  });
}

function buildMutnyLine(t) {
  return TaskFormat.serializeTaskLine({
    creationDate: t,
    text: S.action || S.task,
    contexts: S.contexts.map(context => context.replace(/^@/, '')),
    dueDate: S.dueDate || null,
    goal: S.outcome || null,
    difficulty: S.feelings || null,
    advice: S.advice || null,
  });
}

function continueWithMutny() {
  el('offer-mutny').classList.add('hidden');
  if (!S.action) S.action = S.task;
  S.mode='mutny'; S.flow=FLOWS.mutny; S.history=[]; S.stepIdx=0;
  hide('out-area'); show('step-area'); renderStep(0);
}

function copyOut() {
  navigator.clipboard.writeText(el('out-line').textContent.trim()).then(() => {
    setOutputNote('Скопировано', 'ok');
  }).catch(() => {
    setOutputNote('Не удалось скопировать. Выделите текст и скопируйте вручную.', 'error');
  });
}

function setOutputNote(message, state = '') {
  el('out-note').textContent = message;
  el('out-note').className = 'note' + (state ? ' ' + state : '');
}

function updateSaveStatus() {
  const deleted = el('out-line').textContent.startsWith('# УДАЛЕНО');
  const saved = S.savedOutput !== null && S.savedOutput === el('out-line').textContent;
  el('out-save-status').textContent = deleted
    ? 'Удаление из списка здесь пока не выполняется.' : saved ? 'Сохранено в список' : 'Не сохранено';
  el('out-save-status').className = 'note save-status' + (saved ? ' ok' : '');
  el('save-task-btn').disabled = deleted;
}

function updateNextTask() {
  const document = SorterRuntime.getTasks();
  let currentIndex = -1;
  try { if (S.originalTask) currentIndex = TaskGtd.findTaskIndex(document, S.originalTask, S.occurrence); }
  catch (_) { /* Save reports a stale/ambiguous task; do not guess its occurrence. */ }
  const candidate = TaskGtd.nextUnprocessedTask(document, currentIndex);
  const deleted = el('out-line').textContent.startsWith('# УДАЛЕНО');
  el('next-task-btn').disabled = deleted || !candidate;
  el('next-task-btn').title = candidate ? 'Сохранить результат и открыть следующую неразобранную задачу'
    : 'Других неразобранных задач нет';
}

// process.html does not load dropbox.js, so it records the same local-version
// timestamp directly whenever GTD processing changes the shared task document.
function saveProcessedTaskDocument(text, savedLine) {
  const previous = SorterRuntime.getTasks();
  SorterRuntime.setTasks(text);
  if (previous !== text && !SorterRuntime.isDeveloperMode) {
    localStorage.setItem('dbx_local_version_time', String(Date.now()));
  }
  // Subsequent saves edit the same task instead of duplicating a no-longer-matching original.
  if (savedLine) S.originalTask = savedLine;
  S.openedDocument = text;
  S.savedOutput = savedLine;
  savedProcessState = processDraftState();
}

function addToList() {
  try {
    const existing = SorterRuntime.getTasks();
    if (S.openedDocument !== null && existing !== S.openedDocument) {
      throw new Error('Список изменился во время разбора. Текст не потерян: скопируйте результат и откройте актуальную задачу.');
    }
    const output = el('out-line').textContent.trim();
    // A heart explicitly edited in the result wins over the earlier answer.
    const color = TaskGtd.taskColor(output) || S.priority;
    const result = TaskGtd.saveOutputInDocument(existing, S.originalTask,
      output, todayStr(), { color, occurrence: S.occurrence });
    // Persist before changing UI state or allowing the next navigation.
    saveProcessedTaskDocument(result.document, result.line);
    S.occurrence = result.occurrence;
    el('out-line').textContent = result.line;
    syncOutputDate();
    savedProcessState = processDraftState();
    updateSaveStatus();
    updateNextTask();
    setOutputNote(el('next-task-btn').disabled ? 'Других неразобранных задач нет.' : '', 'ok');
    return true;
  } catch (error) {
    setOutputNote('Не удалось завершить сохранение. ' + error.message, 'error');
    return false;
  }
}

async function resetAll() {
  if (!await SorterUnsavedChanges.confirmDiscard('Начать другой разбор без сохранения текущего?', 'Начать другой')) return;
  Object.assign(S, { task:'', originalTask:'', mode:null, flow:null, stepIdx:0, history:[],
    outcome:'',action:'',delegate:'',dueDate:'',priority:null,contexts:[],feelings:'',advice:'',
    occurrence:null,openedDocument:SorterRuntime.getTasks(),savedOutput:null });
  hide('step-area','out-area','task-cap','edit-area'); show('mode-sel'); window.scrollTo(0,0);
  el('task-input').value = '';
  el('out-line').textContent = '';
  savedProcessState = processDraftState();
}

function nextTask() {
  // This button explicitly promises Save first. Any failure keeps the draft here.
  if (!addToList()) return;
  const document = SorterRuntime.getTasks();
  const index = TaskGtd.findTaskIndex(document, S.originalTask, S.occurrence);
  const next = TaskGtd.nextUnprocessedTask(document, index);
  if (!next) { setOutputNote('Других неразобранных задач нет.', 'ok'); return; }
  const occurrence = document.split(/\r?\n/).slice(0, next.index).filter(line => line.trim() === next.line.trim()).length;
  const from = new URLSearchParams(window.location.search).get('from') === 'tasks' ? 'tasks' : 'list';
  window.location.href = SorterRuntime.withMode('/process?task=' + encodeURIComponent(next.line)
    + '&occurrence=' + occurrence + '&from=' + from);
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function todayStr() { return TaskListOperations.localIsoDate(); }

function syncOutputDate() {
  const task = TaskFormat.parseTaskLine(el('out-line').textContent);
  const deleted = el('out-line').textContent.startsWith('# УДАЛЕНО');
  el('out-due').value = task.dueDate || '';
  el('out-due').disabled = deleted;
  el('google-calendar-btn').disabled = deleted || !TaskGtd.validDate(task.dueDate);
}
function setOutputDue(value) {
  try {
    el('out-line').textContent = TaskGtd.withDueDate(el('out-line').textContent, value);
    S.dueDate = value;
    syncOutputDate();
    updateSaveStatus();
  } catch (error) { setOutputNote(error.message, 'error'); }
}
function openGoogleCalendar() {
  // This explicit action sends only the current title and due date to Google.
  window.open(TaskGtd.googleCalendarUrl(el('out-line').textContent), '_blank', 'noopener,noreferrer');
}
el('out-line').addEventListener('input', () => { syncOutputDate(); updateSaveStatus(); updateNextTask(); });

let savedProcessState = null;
function processDraftState() {
  return JSON.stringify({ task:S.task, outcome:S.outcome, action:S.action,
    delegate:S.delegate, dueDate:S.dueDate, priority:S.priority, contexts:S.contexts,
    feelings:S.feelings, advice:S.advice,
    input:el('task-input').value, field:el('sf')?.value || '',
    output:el('out-line').textContent });
}
SorterUnsavedChanges.register('gtd', () => {
  const current = processDraftState();
  return savedProcessState !== null && current !== savedProcessState ? current : '';
});

window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const tp   = params.get('task');
  const flow = params.get('flow') || 'korz';
  S.openedDocument = SorterRuntime.getTasks();
  const back = el('back-link');
  const bottomBack = el('bottom-back-link');
  bottomBack.href = SorterRuntime.withMode(back.getAttribute('href'));
  if (params.get('from') === 'tasks') { back.textContent = '← К задачам'; bottomBack.textContent = 'К задачам'; }
  if (tp) {
    const fullTask = tp; // URLSearchParams already decodes once; literal % must survive.
    const parsedTask = TaskFormat.parseTaskLine(fullTask);
    S.task = parsedTask.text || fullTask;
    S.originalTask = fullTask;
    S.outcome = parsedTask.goal || '';
    S.feelings = parsedTask.difficulty || '';
    S.advice = parsedTask.advice || '';
    S.contexts = parsedTask.contexts.map(context => '@' + context);
    S.dueDate = parsedTask.dueDate || '';
    S.priority = TaskGtd.taskColor(fullTask);
    const occurrence = params.get('occurrence');
    if (occurrence !== null && /^\d+$/.test(occurrence) && Number.isSafeInteger(Number(occurrence))) {
      S.occurrence = Number(occurrence);
    }
    el('task-cap').textContent = S.task;
    show('task-cap');
    startFlow(FLOWS[flow] ? flow : 'korz');
  }
  savedProcessState = processDraftState();
});
</script>
